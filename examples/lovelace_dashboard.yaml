# FileFlows Dashboard - Lovelace Example Configuration
# Copy relevant sections to your dashboard configuration
# Entity ids assume the host "nas" (device "FileFlows (nas)"); replace "nas" with your host slug.

# ============================================
# COMPLETE DASHBOARD VIEW
# ============================================
title: FileFlows
path: fileflows
icon: mdi:video-vintage
badges: []
cards:
  # Status Header Card
  - type: horizontal-stack
    cards:
      - type: entity
        entity: binary_sensor.fileflows_nas_processing_active
        name: Processing
        icon: mdi:cog-sync
      - type: entity
        entity: sensor.fileflows_nas_active_workers
        name: Runners
        icon: mdi:run-fast
      - type: entity
        entity: sensor.fileflows_nas_unprocessed_files
        name: Queue
        icon: mdi:inbox

  # Main Control Card
  - type: entities
    title: System Control
    show_header_toggle: false
    entities:
      - entity: switch.fileflows_nas_system_active
        name: System Active
        secondary_info: last-changed
      - type: divider
      - entity: button.fileflows_nas_pause_system
        name: Pause Processing
      - entity: button.fileflows_nas_resume_system
        name: Resume Processing
      - entity: button.fileflows_nas_refresh_data
        name: Refresh Data

  # Current Processing Card
  - type: markdown
    title: Currently Processing
    content: |
      {% set processing = state_attr('sensor.fileflows_nas_current_file', 'details') %}
      {% if processing %}
      {% for file in processing %}
      **{{ file.file }}**
      - Library: {{ file.library }}
      - Step: {{ file.step }}
      - Progress: {{ file.progress }}%
      {% endfor %}
      {% else %}
      *No files currently processing*
      {% endif %}

  # File Statistics Card
  - type: glance
    title: File Statistics
    columns: 4
    show_state: true
    entities:
      - entity: sensor.fileflows_nas_unprocessed_files
        name: Queue
        icon: mdi:inbox-full
      - entity: sensor.fileflows_nas_processing_files
        name: Processing
        icon: mdi:progress-clock
      - entity: sensor.fileflows_nas_processed_files
        name: Done
        icon: mdi:check-circle
      - entity: sensor.fileflows_nas_failed_files
        name: Failed
        icon: mdi:alert-circle

  # Storage Savings Gauge
  - type: gauge
    entity: sensor.fileflows_nas_storage_saved_percentage
    name: Storage Savings
    min: 0
    max: 100
    needle: true
    severity:
      green: 50
      yellow: 30
      red: 0
    segments:
      - from: 0
        color: '#db4437'
      - from: 30
        color: '#ffa600'
      - from: 50
        color: '#43a047'

  # Storage Statistics Card
  - type: entities
    title: Storage Statistics
    entities:
      - entity: sensor.fileflows_nas_storage_saved
        name: Total Saved
        icon: mdi:harddisk
      - entity: sensor.fileflows_nas_storage_saved_percentage
        name: Savings Percentage
        icon: mdi:percent

  # Processing Nodes Card
  - type: entities
    title: Processing Nodes
    show_header_toggle: false
    entities:
      - entity: sensor.fileflows_nas_processing_nodes
        name: Total Nodes
      - type: divider
      # Add your node switches here - they will be auto-created
      # Example:
      # - entity: switch.fileflows_nas_node_internal
      #   name: Internal Node
      # - entity: switch.fileflows_nas_node_external
      #   name: External Node

  # Libraries Card
  - type: entities
    title: Libraries
    show_header_toggle: false
    entities:
      - entity: sensor.fileflows_nas_libraries
        name: Total Libraries
      - type: divider
      # Add your library rescan buttons here - they will be auto-created
      # Example:
      # - entity: button.fileflows_nas_rescan_movies
      #   name: Rescan Movies
      # - entity: button.fileflows_nas_rescan_tv_shows
      #   name: Rescan TV Shows

  # System Information Card
  - type: entities
    title: System Information
    entities:
      - entity: sensor.fileflows_nas_version
        name: Version
      - entity: sensor.fileflows_nas_flows
        name: Flows
      - type: attribute
        entity: sensor.fileflows_nas_active_workers
        attribute: total_runners
        name: Total Runners

  # Queue List Card (if you have many files)
  - type: markdown
    title: Queue Preview
    content: |
      {% set files = state_attr('sensor.fileflows_nas_upcoming_files', 'files') %}
      {% if files %}
      | # | File | Library |
      |---|------|---------|
      {% for file in files[:5] %}
      | {{ loop.index }} | {{ file.name[:40] }}{% if file.name|length > 40 %}...{% endif %} | {{ file.library }} |
      {% endfor %}
      {% if files|length > 5 %}
      
      *...and {{ files|length - 5 }} more files*
      {% endif %}
      {% else %}
      *Queue is empty*
      {% endif %}

